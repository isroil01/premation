name: Feature request
description: Suggest a capability, or an After Effects behaviour this is missing.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/isroil01/motion-editor/blob/main/ROADMAP.md)
        first — it lists what is planned, and what is deliberately out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the goal, not just the feature. Knowing what you are actually
        trying to achieve often surfaces a better solution than the one either of
        us would have guessed.
      placeholder: >
        I need to mask a layer to a moving subject across 200 frames, and doing it
        by hand keyframe-by-keyframe is not viable.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed solution, if you have one.
    validations:
      required: true

  - type: input
    id: prior-art
    attributes:
      label: Prior art
      description: >
        How do After Effects, Cavalry, Rive or others handle this? Naming the tool
        and the feature makes the expected behaviour much clearer.
      placeholder: "After Effects: Roto Brush 2"

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How you are dealing with it today, if at all.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be interested in implementing this?
      description: No obligation — it just helps to know.
      options:
        - "I'd like to try, with some guidance"
        - "Yes, I can take it on"
        - "No, just requesting"
    validations:
      required: true
