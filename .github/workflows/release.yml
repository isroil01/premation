# Cut a release: build SIGNED installers for Windows and macOS and the Linux
# AppImage (unsigned: Linux has no signing gate) and attach them to a GitHub
# release that users download from — and that installed apps read to discover
# updates.
#
# ── WHERE THIS RUNS, AND WHAT IT BUILDS ──────────────────────────────────────
# The source is in the PRIVATE repository (SOURCE_REPO below). This workflow
# runs in the PUBLIC repository, where the releases and the update manifests
# live (electron-builder.yml `publish`) and where Actions minutes are free.
# Every job checks the private source out with a read-only deploy key (secret
# PRIVATE_SOURCE_KEY here; its public half is a deploy key on SOURCE_REPO).
# No private commit and no private tag is pushed to this repository. The same
# file is kept in both repositories; it is only ever started here.
#
#   (private repo)  npm run release:patch          # bumps package.json, commits, tags v0.1.1
#   (private repo)  git push --follow-tags         # to the private origin; starts nothing
#   gh workflow run release.yml --repo <public repo> -f ref=v0.1.1
#
# Then in GitHub ▸ Releases (public repo) a DRAFT is waiting. Write the notes,
# press Publish. No installed app sees the update until you do
# (electron-builder.yml: `releaseType: draft`). Publishing creates the tag in
# the public repository on its default branch; nothing is triggered by it.
#
# A REHEARSAL is the same command with a branch: `-f ref=main`. It builds and
# checks everything and publishes nothing. Add `-f only=Windows` for one
# platform.
#
# ── RELEASE POLICY, enforced below rather than documented ────────────────────
#  1. Releases come from the private repository's `main` ONLY (RELEASE_BRANCH
#     below). A tag that is not an ancestor of it fails the pipeline. No
#     release from a feature branch.
#  2. Flow: feature branch → main → tag → release.
#  3. Artifacts are built from the TAGGED COMMIT, never a working tree: verify
#     resolves the ref to one commit and every later job builds that commit.
#  4. Signing is CONDITIONAL, and the path taken is always stated in the output:
#       secrets present -> sign, notarize, staple, verify. A build that FAILS
#                          verification does not publish. No fallback.
#       secrets absent  -> build and publish UNSIGNED, clearly labelled.
#
# The distinction that matters: "we chose not to sign" and "we tried to sign and
# it broke" must never produce the same artifact. The first is a decision; the
# second is a defect being shipped. Hence — skipping is allowed, FAILING is not.
#
# TEMPORARY ACCOMMODATION (2026-08-03): macOS ships unsigned while the Apple
# Developer Program membership is pending. EXPIRY: when the Developer ID
# certificate lands, populate the secrets and this path stops being taken on its
# own — no code change needed. See RELEASING.md "Unsigned macOS distribution".
name: release
run-name: release ${{ inputs.ref }}${{ inputs.only && format(' ({0} only)', inputs.only) || '' }}

on:
  # Started by hand only. There is no tag trigger: the tag is in the private
  # repository, and the tag GitHub creates here when a draft is published must
  # not start a second build.
  #
  # Re-package ONE platform onto a tag's draft without rebuilding the engines
  # (hours on a cache miss) — after a packaging-only fix:
  #   gh workflow run release.yml -f ref=v1.2.3 -f engines_from_run=<run id> -f only=macOS
  # The engines come from <run id>'s artifacts (kept 3 days), and verify refuses
  # unless native/ is identical between that run's commit and this one.
  workflow_dispatch:
    inputs:
      ref:
        description: 'What to build, in the private repository: a release tag (v1.2.3) publishes a draft; a branch (main) is a rehearsal and publishes nothing'
        required: true
        default: 'main'
      engines_from_run:
        description: 'Reuse the engines built by this release run id (skips the engine builds)'
        required: false
        default: ''
      only:
        description: 'Build only this platform: Windows, macOS or Linux (empty = all)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read     # download-artifact from an earlier run (engines_from_run)

env:
  # Where the source is. Read with the deploy key PRIVATE_SOURCE_KEY.
  SOURCE_REPO: isroil01/premation-pro
  # The branch of SOURCE_REPO a release tag must be on.
  RELEASE_BRANCH: main
  # The ref asked for: a release tag (v1.2.3) or, for a rehearsal, a branch.
  # A ref that starts with "v" is a release, and everything that publishes is
  # conditional on that.
  TAG: ${{ inputs.ref }}

jobs:
  verify:
    name: Verify tag, branch, types and tests
    runs-on: ubuntu-latest
    outputs:
      # Consumed by every conditional in `build`. Computed once, in one place,
      # so the two platforms cannot disagree about what was decided.
      signMac: ${{ steps.signing.outputs.mac }}
      signWin: ${{ steps.signing.outputs.win }}
      platforms: ${{ steps.platforms.outputs.list }}
      # The one commit this run builds. `inputs.ref` is resolved here, once:
      # a branch can move while the engines build, and two jobs building two
      # commits would ship an engine that does not match its UI.
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          # Full history: the ancestry check needs the release branch, and a
          # shallow clone would make every tag look unreachable from it.
          fetch-depth: 0

      - name: The commit this run builds
        id: source
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "$sha" > source-sha.txt
          echo "building $TAG = $sha"
      # Read back by a later repackage run (engines_from_run), which has to
      # know which commit these engines were built from. This run's own
      # head_sha is the public repository's, not the source's.
      - uses: actions/upload-artifact@v4
        with:
          name: source-sha
          path: source-sha.txt
          if-no-files-found: error
          retention-days: 14

      # ── POLICY GATE 1: the tag must be on the release branch ──
      #
      # A tag pushed from a feature branch builds and publishes exactly as
      # convincingly as a real release — the installer is real, the update
      # manifest is real, and users get it. Nothing downstream can tell the
      # difference, so this is the only place that can refuse.
      - name: Tag must be an ancestor of the release branch
        if: startsWith(inputs.ref, 'v')
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git tag --points-at HEAD | grep -qx "$TAG"; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z) of $SOURCE_REPO. For a rehearsal pass a branch that does not start with v, such as main."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::Tag $TAG ($SOURCE_SHA) is not an ancestor of $RELEASE_BRANCH."
            echo "::error::Releases are cut from $RELEASE_BRANCH only. Flow: feature -> $RELEASE_BRANCH -> tag."
            echo "::error::Merge to $RELEASE_BRANCH first, then tag the merge commit."
            exit 1
          fi
          echo "OK: $TAG is on $RELEASE_BRANCH."

      # The `build` matrix (workflow_dispatch `only` keeps one; a tag push builds all).
      #   signing  which secrets gate the signed path; `none` = always unsigned
      #   Windows  NSIS → Premation-Setup-Windows.exe
      #   macOS    BOTH architectures in ONE job, deliberately: two jobs would
      #            each publish their own latest-mac.yml and the second would
      #            overwrite the first, leaving one architecture unable to update.
      #   Linux    AppImage → Premation-Linux-x86_64.AppImage + latest-linux.yml
      - name: Platforms to package
        id: platforms
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          all='[
            {"os":"windows-latest","name":"Windows","signing":"win","args":"--win"},
            {"os":"macos-latest","name":"macOS","signing":"mac","args":"--mac --x64 --arm64"},
            {"os":"ubuntu-latest","name":"Linux","signing":"none","args":"--linux --x64"}
          ]'
          case "${ONLY}" in
            ''|Windows|macOS|Linux) ;;
            *) echo "::error::only must be Windows, macOS or Linux (got '$ONLY')"; exit 1 ;;
          esac
          list=$(jq -c --arg only "$ONLY" '[.[] | select($only == "" or .name == $only)]' <<<"$all")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "packaging: $list"

      # Reused engines must be built from the same native/ sources as this commit.
      - name: Reused engines match this commit's native/
        if: ${{ inputs.engines_from_run != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.engines_from_run }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name source-sha --dir "$RUNNER_TEMP/engines-run"
          sha=$(tr -d '[:space:]' < "$RUNNER_TEMP/engines-run/source-sha.txt")
          echo "engines from run $RUN_ID (commit $sha); packaging $SOURCE_SHA"
          git fetch --no-tags origin "$sha"
          if ! git diff --quiet "$sha" "$SOURCE_SHA" -- native/; then
            echo "::error::native/ changed since run $RUN_ID's commit $sha: its engines are not this commit's. Run the full release."
            git diff --stat "$sha" "$SOURCE_SHA" -- native/
            exit 1
          fi
          echo "OK: native/ is identical."

      - uses: actions/setup-node@v4
        with:
          # electron 44 / @electron/rebuild 4 declare node >= 22.12.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ── POLICY GATE 2: tag matches package.json ──
      # electron-builder reads the version from package.json and writes it into
      # latest.yml. If the two disagree the release is called v1.2.3 while the
      # update metadata says 1.2.2, and every client either misses the update or
      # installs it forever.
      - name: Tag matches package.json version
        if: startsWith(inputs.ref, 'v')
        run: |
          WANT="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$WANT package.json=$PKG"
          if [ "$WANT" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG."
            echo "::error::Bump with 'npm run release:patch' rather than tagging by hand."
            exit 1
          fi

      # ── GATE 3 IS NOW A DECISION, NOT A FAILURE ──
      #
      # Reports which path the release will take, per platform, and says so
      # loudly either way. A release must never be ambiguous about whether it
      # was signed — an unsigned artifact is acceptable while we have no
      # certificate; an unsigned artifact nobody realised was unsigned is not.
      - name: Decide signing path
        id: signing
        env:
          MAC_CSC: ${{ secrets.MAC_CSC_LINK }}
          MAC_PW: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC: ${{ secrets.WIN_CSC_LINK }}
          WIN_PW: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          mac=true
          for v in MAC_CSC MAC_PW APPLE_ID APPLE_PW APPLE_TEAM; do
            [ -z "${!v}" ] && mac=false
          done
          win=true
          for v in WIN_CSC WIN_PW; do
            [ -z "${!v}" ] && win=false
          done
          echo "mac=$mac" >> "$GITHUB_OUTPUT"
          echo "win=$win" >> "$GITHUB_OUTPUT"

          {
            echo "### Signing path"
            echo ""
            if [ "$mac" = true ]; then
              echo "- **macOS: SIGNED** — will sign, notarize, staple and verify."
            else
              echo "- **macOS: UNSIGNED** — no Developer ID secrets. Gatekeeper will block the app;"
              echo "  users must allow it via System Settings ▸ Privacy & Security."
            fi
            if [ "$win" = true ]; then
              echo "- **Windows: SIGNED** — will sign and verify the RFC-3161 timestamp."
            else
              echo "- **Windows: UNSIGNED** — SmartScreen will warn; installs via More info ▸ Run anyway."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$mac" = true ] || echo "::warning::macOS artifacts will be UNSIGNED (accommodation dated 2026-08-03; see RELEASING.md)."
          [ "$win" = true ] || echo "::warning::Windows artifacts will be UNSIGNED."

      - run: npm run typecheck
      - run: npx tsc -p electron/tsconfig.json --noEmit
      - run: npm test -- --ci
      # A release must not ship unlinted either; CI gates dev, this gates the tag.
      - run: npm run lint

  # ── The C++ engine, per shipped target ──
  #
  # premation-engine is the app's only engine (docs/TS_ENGINE_REMOVAL.md), so a
  # release without it is not a release: every target builds it here, from the
  # tagged commit, with the vcpkg binary cache (.github/actions/build-engine).
  # The Intel Mac engine is cross-built on the Apple-silicon runner
  # (macos-clang-engine-x64); electron-builder's beforePack
  # (scripts/stageEngine.cjs) stages the engine matching each dmg's arch and
  # FAILS the package if it is missing.
  #
  # Only the `premation-release` target is built (native/engine/CMakeLists.txt):
  # the engine, the host bridge and premation-plugins for the SDK — not the test
  # suites, the fuzzer or the tools, which native.yml builds and runs. 330 min:
  # a vcpkg cache miss on the 3-core macOS runner adds ~2 h of Dawn / Skia /
  # ffmpeg from source.
  engine:
    name: Engine ${{ matrix.name }}
    needs: verify
    if: ${{ inputs.engines_from_run == '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      # Each engine runs to its own end: one platform's failure used to cancel
      # the others hours into their dependency builds, before they could save
      # their cache or show whether they build at all. Packaging still needs
      # every engine (`build` needs this whole job).
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            preset: windows-clang-cl-engine
            triplet: x64-windows-static-md
          - name: macOS arm64
            os: macos-latest
            preset: macos-clang-engine
            triplet: arm64-osx
          - name: macOS x64
            os: macos-latest
            preset: macos-clang-engine-x64
            triplet: x64-osx
          # The oldest runner image, not ubuntu-latest: the engine needs the
          # glibc of the image it is linked on, so this image is the oldest
          # Linux the release runs on (glibc 2.35; gated in build-engine).
          - name: Linux x64
            os: ubuntu-22.04
            preset: linux-clang-engine
            triplet: x64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.verify.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
      - name: Build premation-engine
        id: engine
        uses: ./.github/actions/build-engine
        with:
          preset: ${{ matrix.preset }}
          triplet: ${{ matrix.triplet }}
          # native/vcpkg.json builtin-baseline (the same pin native.yml uses).
          vcpkg-commit: c76c06644034521fb761a39f8f52d8e87d1103d5
          target: premation-release
      - name: Upload the engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.preset }}
          path: |
            ${{ steps.engine.outputs.engine-dir }}/premation-engine
            ${{ steps.engine.outputs.engine-dir }}/premation-engine.exe
            ${{ steps.engine.outputs.engine-dir }}/premation-host-bridge.node
            ${{ steps.engine.outputs.engine-dir }}/*.dll
            ${{ steps.engine.outputs.engine-dir }}/*.dylib
            ${{ steps.engine.outputs.engine-dir }}/*.so
            ${{ steps.engine.outputs.engine-dir }}/*.so.*
          if-no-files-found: error
          retention-days: 3
      # What turns a crash location back into a function and a line
      # (docs/CRASH_SYMBOLS.md). The PDB ships to nobody: not in the engine
      # artifact above, not in an installer.
      - name: Upload the engine's symbols
        if: matrix.preset == 'windows-clang-cl-engine'
        uses: actions/upload-artifact@v4
        with:
          name: premation-engine-symbols-windows-x64
          path: |
            ${{ steps.engine.outputs.engine-dir }}/premation-engine.exe
            ${{ steps.engine.outputs.engine-dir }}/premation-engine.pdb
          if-no-files-found: error
          retention-days: 90
      # The plugin SDK for this platform (AE parity 2.2, docs/PLUGIN_STORE.md):
      # headers, the CMake package, premation-plugins, the pack/sign tools.
      - name: Install the plugin SDK
        shell: bash
        run: |
          cmake --install native/build/${{ matrix.preset }} --component sdk --prefix sdk-out
          case "${{ matrix.preset }}" in
            windows-*) name=premation-sdk-windows-x64 ;;
            linux-*) name=premation-sdk-linux-x64 ;;
            macos-clang-engine-x64) name=premation-sdk-macos-x64 ;;
            *) name=premation-sdk-macos-arm64 ;;
          esac
          echo "SDK_NAME=$name" >> "$GITHUB_ENV"
      - name: Upload the plugin SDK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SDK_NAME }}
          path: sdk-out/
          if-no-files-found: error
          retention-days: 3

  # The SDK zips go on the draft beside the installers. The Linux SDK comes
  # from the Linux engine build above, like the other three.
  sdk-release:
    name: Attach the plugin SDKs
    needs: [engine, draft]
    # A repackage leaves the SDK zips the full run attached.
    if: ${{ startsWith(inputs.ref, 'v') && inputs.engines_from_run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: premation-sdk-*
          path: sdks
      - name: Zip and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sdks
          for d in premation-sdk-*; do (cd "$d" && zip -qr "../$d.zip" .); done
          gh release upload "$TAG" premation-sdk-*.zip --repo "$GITHUB_REPOSITORY" --clobber

  # One draft, created once, BEFORE the platform builds run. electron-builder
  # looks for an existing draft by tag and attaches to it; when two platform
  # jobs publish at the same moment and no draft exists yet, each creates its
  # own — v0.9.0 ended up as two half-releases, Windows in one and macOS in the
  # other. Creating the draft here, serially, leaves nothing to race for.
  draft:
    name: Create the draft release
    needs: verify
    if: startsWith(inputs.ref, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse the draft for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A draft needs no tag: publishing it creates the tag in this repository,
        # on its default branch. Nothing of the source's history goes with it.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft for $TAG already exists in $GITHUB_REPOSITORY; the builds attach to it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft               --title "${TAG#v}" --notes "Release notes: see CHANGELOG.md."
            echo "Created draft $TAG in $GITHUB_REPOSITORY."
          fi

  build:
    name: Build ${{ matrix.name }}
    # `draft` is skipped on a workflow_dispatch rehearsal; `always()` keeps the
    # builds running then, while a FAILED draft job still stops them. `engine`
    # is skipped on a repackage (engines_from_run).
    needs: [verify, engine, draft]
    if: ${{ always() && needs.verify.result == 'success' && (needs.engine.result == 'success' || (needs.engine.result == 'skipped' && inputs.engines_from_run != '')) && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The platform list (os / name / signing / args) is in verify's
        # "Platforms to package" step, filtered there by workflow_dispatch `only`.
        include: ${{ fromJSON(needs.verify.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.verify.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}

      - uses: actions/setup-node@v4
        with:
          # electron 44 / @electron/rebuild 4 declare node >= 22.12.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ── The engine the installers ship (built by the `engine` job) ──
      # Into the preset directories scripts/stageEngine.cjs stages from. Unix
      # permissions do not survive artifacts: the executable bit is restored.
      - name: Fetch the Windows engine
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: engine-windows-clang-cl-engine
          # A repackage (engines_from_run) takes the engines that run built.
          run-id: ${{ inputs.engines_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native/build/windows-clang-cl-engine/engine
      - name: Fetch the macOS engines (arm64 + x64)
        if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@v4
        with:
          name: engine-macos-clang-engine
          # A repackage (engines_from_run) takes the engines that run built.
          run-id: ${{ inputs.engines_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native/build/macos-clang-engine/engine
      - name: Fetch the macOS x64 engine
        if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@v4
        with:
          name: engine-macos-clang-engine-x64
          # A repackage (engines_from_run) takes the engines that run built.
          run-id: ${{ inputs.engines_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native/build/macos-clang-engine-x64/engine
      - name: Fetch the Linux engine
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v4
        with:
          name: engine-linux-clang-engine
          # A repackage (engines_from_run) takes the engines that run built.
          run-id: ${{ inputs.engines_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native/build/linux-clang-engine/engine
      - name: Check the Linux engine
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/build/linux-clang-engine/engine/premation-engine
          file native/build/linux-clang-engine/engine/premation-engine | grep -q 'x86-64'
          ls -la native/build/linux-clang-engine/engine
          echo "engine: x86-64 OK"
      - name: Check the engines' architectures
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/build/macos-clang-engine/engine/premation-engine native/build/macos-clang-engine-x64/engine/premation-engine
          lipo -archs native/build/macos-clang-engine/engine/premation-engine | grep -qx arm64
          lipo -archs native/build/macos-clang-engine-x64/engine/premation-engine | grep -qx x86_64
          lipo -archs native/build/macos-clang-engine/engine/premation-host-bridge.node | grep -qx arm64
          lipo -archs native/build/macos-clang-engine-x64/engine/premation-host-bridge.node | grep -qx x86_64
          lipo -archs native/build/macos-clang-engine/engine/libpdfium.dylib | grep -qx arm64
          lipo -archs native/build/macos-clang-engine-x64/engine/libpdfium.dylib | grep -qx x86_64
          lipo -archs native/build/macos-clang-engine/engine/libonnxruntime.dylib | grep -qx arm64
          lipo -archs native/build/macos-clang-engine-x64/engine/libonnxruntime.dylib | grep -qx x86_64
          echo "engines: arm64 + x86_64 OK"

      # better-sqlite3 is an OPTIONAL dependency so a contributor without a
      # native toolchain can still install (the driver is behind a guarded
      # require and the app degrades to an in-memory index). A RELEASE must
      # not degrade silently, so assert here that it really built.
      - name: Assert the SQLite driver built
        shell: bash
        run: |
          node -e "try{require('better-sqlite3');console.log('better-sqlite3: built')}catch(e){console.error('::error::better-sqlite3 failed to build; the release would ship without the local index');console.error(e.message);process.exit(1)}"

      # ── POLICY GATE 3: the installers must know where the backend is ──
      #
      # This was a WARNING placed AFTER the build, and it was survivable only
      # because `.env.production` was committed and supplied the origin as a
      # fallback. That arrangement let the warning lie in both directions: it
      # reads `vars.` alone, so it announced "these installers point at
      # localhost" while the committed file had in fact set a real origin.
      #
      # The file is gitignored now — it is per-deployment config, not source —
      # so the fallback is gone and the variable is the only source. A missing
      # one would hard-wire the installers to http://localhost:4000: an app that
      # cannot reach the backend at all, found by users rather than by us, and
      # fixable only by cutting another release.
      #
      # So it FAILS, and it fails BEFORE the build rather than after, so nothing
      # is compiled, signed, notarized or uploaded against an origin we already
      # know is wrong. A release that cannot say where its backend is has
      # nothing worth publishing.
      #
      #   Settings > Secrets and variables > Actions > Variables
      - name: Backend origin must be configured
        if: ${{ vars.VITE_BACKEND_ORIGIN == '' }}
        shell: bash
        run: |
          echo "::error::VITE_BACKEND_ORIGIN is not set, so these installers would point at http://localhost:4000."
          echo "::error::Set the repository variable under Settings > Secrets and variables > Actions > Variables."
          exit 1

      # The pinned ffmpeg archives (electron/ffmpegManifest.json): fetched once
      # per pin, not per release. A cache miss just downloads; the SHA-256 pin is
      # checked either way (scripts/fetchFfmpeg.cjs).
      - name: Cache the pinned ffmpeg
        uses: actions/cache@v4
        with:
          path: build/.cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('electron/ffmpegManifest.json') }}

      - name: Build renderer and main process
        shell: bash
        env:
          # Rollup's chunk graph for the renderer outgrew Node's default heap
          # on the macOS arm64 runner (v0.8.3 died at "Reached heap limit").
          # 6 GB fits every hosted runner this job uses; harmless where the
          # default already sufficed.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ -n "${{ vars.VITE_BACKEND_ORIGIN }}" ]; then export VITE_BACKEND_ORIGIN="${{ vars.VITE_BACKEND_ORIGIN }}"; fi
          if [ -n "${{ vars.VITE_MEDIA_ORIGINS }}" ]; then export VITE_MEDIA_ORIGINS="${{ vars.VITE_MEDIA_ORIGINS }}"; fi
          npm run electron:build

      # ── Bake the origin into the manifest the MAIN process reads ──
      #
      # `VITE_BACKEND_ORIGIN` above reaches the renderer and the CSP, and only
      # those. Main resolves the backend separately, in `electron/apiBase.ts`,
      # and it cannot read `import.meta.env` — so before this step it fell back
      # to http://localhost:4000 in every packaged build. Desktop sign-in and
      # every `api.request` go through main, so the shipped app could not reach
      # the backend at all. That is 0.3.1's "login is broken".
      #
      # Written into package.json rather than passed as
      # `--config.extraMetadata.backendOrigin`, because electron-builder is
      # invoked FOUR times below (package + publish, signed + unsigned) and a
      # flag on three of four would ship an unbaked build from whichever path
      # was missed. The manifest is read by all of them.
      #
      # `npm pkg set` rather than a sed: it is npm's own JSON writer, so it
      # cannot corrupt the file the packager is about to read.
      - name: Bake the backend origin into the packaged manifest
        shell: bash
        run: |
          npm pkg set backendOrigin="${{ vars.VITE_BACKEND_ORIGIN }}"
          BAKED="$(node -p "require('./package.json').backendOrigin || ''")"
          if [ -z "$BAKED" ]; then
            echo "::error::backendOrigin was not written to package.json; main would fall back to localhost."
            exit 1
          fi
          echo "main-process backend origin: $BAKED"

      # ── Package + sign ──
      # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD from the environment.
      # Notarization is done explicitly below rather than by electron-builder, so
      # submission, stapling and verification are separate inspectable steps.
      - name: Package (SIGNED)
        if: ${{ (matrix.signing == 'mac' && needs.verify.outputs.signMac == 'true') || (matrix.signing == 'win' && needs.verify.outputs.signWin == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder ${{ matrix.args }} --publish never

      # CSC_IDENTITY_AUTO_DISCOVERY=false is set EXPLICITLY here rather than left
      # to an empty CSC_LINK. On macOS, electron-builder will otherwise find a
      # certificate in the runner keychain and sign with whatever it happens to
      # be — producing an artifact signed by an identity nobody chose. Skipping
      # has to be as deliberate as signing.
      - name: Package (UNSIGNED — no certificate configured)
        if: ${{ (matrix.signing == 'mac' && needs.verify.outputs.signMac != 'true') || (matrix.signing == 'win' && needs.verify.outputs.signWin != 'true') || matrix.signing == 'none' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # bash on every runner: the Windows default is pwsh, which does not read the `if`.
        shell: bash
        run: |
          if [ "${{ matrix.signing }}" = "none" ]; then
            echo "Building ${{ matrix.name }} unsigned — this platform has no signing step."
          else
            echo "::warning::Building ${{ matrix.name }} UNSIGNED — no signing certificate is configured."
          fi
          npx electron-builder ${{ matrix.args }} --publish never

      # ── The engine is inside every package ──
      # stageEngine.cjs already refuses to package without it; this checks the
      # output, where a filter or signing mistake would drop it silently.
      - name: Verify the engine shipped
        shell: bash
        run: |
          set -euo pipefail
          # macOS runs bash 3.2, which has no globstar: `find` there.
          if [ "$RUNNER_OS" = "Windows" ]; then
            shopt -s globstar nullglob
            for f in premation-engine.exe dxcompiler.dll dxil.dll pdfium.dll; do
              ls release/**/win-unpacked/resources/engine/$f >/dev/null || { echo "::error::$f missing from win-unpacked/resources/engine"; exit 1; }
            done
          elif [ "$RUNNER_OS" = "Linux" ]; then
            shopt -s globstar nullglob
            eng=$(ls release/**/linux-unpacked/resources/engine/premation-engine | head -1)
            [ -n "$eng" ] || { echo "::error::premation-engine missing from linux-unpacked/resources/engine"; exit 1; }
            test -x "$eng" || { echo "::error::premation-engine is not executable in the package"; exit 1; }
            ls -la "$(dirname "$eng")"
            ls release/**/*.AppImage >/dev/null || { echo "::error::no AppImage produced"; exit 1; }
          else
            found=0
            while IFS= read -r app; do
              found=1
              for f in premation-engine premation-host-bridge.node libpdfium.dylib libonnxruntime.dylib; do
                test -f "$app/Contents/Resources/engine/$f" || { echo "::error::$f missing from $app"; exit 1; }
              done
              codesign --verify --strict --verbose=2 "$app/Contents/Resources/engine/premation-engine" || [ "${{ needs.verify.outputs.signMac }}" != "true" ]
            done < <(find release -type d -name '*.app' -prune)
            [ "$found" = 1 ] || { echo "::error::no .app produced"; exit 1; }
          fi
          echo "engine present in every package"

      # ── ffmpeg is inside every package, for the right CPU, and runs ──
      # fetchFfmpeg.cjs refuses to package without it; this checks the output.
      # Without it every video export fails on a machine with no ffmpeg of its own.
      - name: Verify ffmpeg shipped
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            shopt -s globstar nullglob
            exe=$(ls release/**/win-unpacked/resources/ffmpeg/ffmpeg.exe | head -1)
            [ -n "$exe" ] || { echo "::error::ffmpeg.exe missing from win-unpacked/resources/ffmpeg"; exit 1; }
            ls release/**/win-unpacked/resources/ffmpeg/LICENSE.txt >/dev/null || { echo "::error::ffmpeg LICENSE.txt missing"; exit 1; }
            enc=$("$exe" -hide_banner -encoders)
            for e in libx264 aac libvpx-vp9 libopus prores_ks gif; do
              grep -qE "^ [VAS][A-Z.]{5} $e " <<<"$enc" || { echo "::error::bundled ffmpeg has no $e encoder"; exit 1; }
            done
          elif [ "$RUNNER_OS" = "Linux" ]; then
            shopt -s globstar nullglob
            ff=$(ls release/**/linux-unpacked/resources/ffmpeg/ffmpeg | head -1)
            [ -n "$ff" ] || { echo "::error::ffmpeg missing from linux-unpacked/resources/ffmpeg"; exit 1; }
            test -x "$ff" || { echo "::error::ffmpeg is not executable in the package"; exit 1; }
            ls release/**/linux-unpacked/resources/ffmpeg/LICENSE.txt >/dev/null || { echo "::error::ffmpeg LICENSE.txt missing"; exit 1; }
            "$ff" -hide_banner -version | head -1
            enc=$("$ff" -hide_banner -encoders)
            for e in libx264 aac libvpx-vp9 libopus prores_ks gif; do
              grep -qE "^ [VAS][A-Z.]{5} $e " <<<"$enc" || { echo "::error::bundled ffmpeg has no $e encoder"; exit 1; }
            done
          else
            found=0
            while IFS= read -r app; do
              found=1
              ff="$app/Contents/Resources/ffmpeg/ffmpeg"
              test -x "$ff" || { echo "::error::ffmpeg missing (or not executable) in $app"; exit 1; }
              test -f "$app/Contents/Resources/ffmpeg/LICENSE.txt" || { echo "::error::ffmpeg LICENSE.txt missing in $app"; exit 1; }
              # Same CPU as the engine beside it: an x64 ffmpeg in the arm64 dmg is "wrong-arch" for every user.
              eng=$(lipo -archs "$app/Contents/Resources/engine/premation-engine")
              got=$(lipo -archs "$ff")
              [ "$eng" = "$got" ] || { echo "::error::$app: ffmpeg is $got but the engine is $eng"; exit 1; }
              if [ "$got" = "$(uname -m)" ]; then "$ff" -hide_banner -version | head -1; fi
              codesign --verify --strict --verbose=2 "$ff" || [ "${{ needs.verify.outputs.signMac }}" != "true" ]
            done < <(find release -type d -name '*.app' -prune)
            [ "$found" = 1 ] || { echo "::error::no .app produced"; exit 1; }
          fi
          echo "ffmpeg present in every package"

      # ── macOS: notarize, then STAPLE ──
      # Stapling matters more than it looks. Without the ticket attached, a
      # machine that is offline — or behind a filter that blocks Apple's
      # verification endpoints — cannot check the notarization and Gatekeeper
      # blocks the app, on a build that IS notarized.
      - name: Notarize and staple (macOS)
        if: ${{ matrix.os == 'macos-latest' && needs.verify.outputs.signMac == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          find release -type f -name '*.dmg' | while IFS= read -r dmg; do
            echo "-- notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done

      # ── FAIL-CLOSED VERIFICATION, before upload ──
      # Without this the pipeline can succeed with a silently unsigned build:
      # electron-builder does NOT fail when CSC_LINK is empty, it just skips
      # signing and carries on.
      # Runs ONLY on the signed path. Its job is to catch a signing attempt that
      # silently produced nothing — electron-builder exits 0 when signing is
      # skipped, so without this a broken certificate looks like a clean build.
      - name: Verify macOS artifacts are signed, notarized and stapled
        if: ${{ matrix.os == 'macos-latest' && needs.verify.outputs.signMac == 'true' }}
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r dmg; do
            found=1
            echo "-- verifying $dmg"
            spctl -a -vvv --type install "$dmg"   # rejects unsigned/improperly signed
            xcrun stapler validate "$dmg"          # rejects a missing ticket
          done < <(find release -type f -name '*.dmg')
          [ "$found" = 1 ] || { echo "::error::No .dmg produced"; exit 1; }

      - name: Verify Windows artifacts are signed and timestamped
        if: ${{ matrix.os == 'windows-latest' && needs.verify.outputs.signWin == 'true' }}
        shell: pwsh
        run: |
          $found = $false
          Get-ChildItem -Path release -Recurse -Filter *.exe | ForEach-Object {
            $found = $true
            Write-Host "-- verifying $($_.FullName)"
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "   status: $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "Unsigned or invalid signature: $($_.Name) [$($sig.Status)]"
              exit 1
            }
            # A signature without a timestamp stops validating the day the
            # certificate expires, retroactively breaking every build shipped.
            if (-not $sig.TimeStamperCertificate) {
              Write-Error "Signature is not RFC-3161 timestamped: $($_.Name)"
              exit 1
            }
          }
          if (-not $found) { Write-Error "No .exe produced"; exit 1 }

      # Publish only AFTER verification passed (when it ran), and only on a tag.
      - name: Publish to the draft release (SIGNED)
        if: ${{ startsWith(inputs.ref, 'v') && ((matrix.signing == 'mac' && needs.verify.outputs.signMac == 'true') || (matrix.signing == 'win' && needs.verify.outputs.signWin == 'true')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder ${{ matrix.args }} --publish always

      - name: Publish to the draft release (UNSIGNED)
        if: ${{ startsWith(inputs.ref, 'v') && ((matrix.signing == 'mac' && needs.verify.outputs.signMac != 'true') || (matrix.signing == 'win' && needs.verify.outputs.signWin != 'true') || matrix.signing == 'none') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.args }} --publish always

      # The release is a DRAFT, so a human writes the notes before anyone can
      # download this. Putting the unsigned warning in the job summary is how
      # that human finds out — the alternative is discovering it from a user.
      - name: State the signing outcome
        if: always()
        shell: bash
        run: |
          SIGNED='${{ (matrix.signing == 'mac' && needs.verify.outputs.signMac) || (matrix.signing == 'win' && needs.verify.outputs.signWin) || 'false' }}'
          if [ "$SIGNED" = "true" ]; then
            echo "### ${{ matrix.name }}: SIGNED and verified" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ matrix.signing }}" = "none" ]; then
            {
              echo "### ${{ matrix.name }}: unsigned (no signing step on this platform)"
              echo ""
              echo "Add this to the release notes before publishing:"
              echo ""
              echo "> Linux: download the AppImage, mark it executable (\`chmod +x Premation-Linux-x86_64.AppImage\`"
              echo "> or Properties ▸ Permissions) and run it. It needs FUSE 2 (\`libfuse2\` on Debian/Ubuntu)"
              echo "> and a Vulkan-capable GPU driver. Updates install in place."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ${{ matrix.name }}: **UNSIGNED**"
              echo ""
              echo "Add this to the release notes before publishing:"
              echo ""
              if [ "${{ matrix.os }}" = "macos-latest" ]; then
                echo "> macOS: this build is not signed or notarized. macOS will refuse to open it"
                echo "> on first launch. Go to **System Settings > Privacy & Security**, find the"
                echo "> blocked app, and choose **Open Anyway**. Control-clicking the app does NOT"
                echo "> work on macOS Sequoia or later."
              else
                echo "> Windows: this build is not signed. SmartScreen will show"
                echo "> \"Windows protected your PC\" — choose **More info > Run anyway**."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}${{ ((matrix.signing == 'mac' && needs.verify.outputs.signMac == 'true') || (matrix.signing == 'win' && needs.verify.outputs.signWin == 'true')) && '-signed' || (matrix.signing == 'none' && '-unsigned') || '-UNSIGNED' }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error
          retention-days: 14
