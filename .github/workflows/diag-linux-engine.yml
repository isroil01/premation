# Temporary: why the Linux engine still links libstdc++.so, and whether
# dropping the explicit -lstdc++ fixes it. Removed once answered.
name: diag linux engine
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Private branch to build'
        required: true
        default: 'release/engine-fixes'
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: isroil01/premation-pro
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
      - name: Build premation-engine
        id: engine
        continue-on-error: true
        uses: ./.github/actions/build-engine
        with:
          preset: linux-clang-engine
          triplet: x64-linux
          vcpkg-commit: c76c06644034521fb761a39f8f52d8e87d1103d5
          target: premation-release
      - name: What each shipped file needs
        if: always()
        working-directory: native/build/linux-clang-engine
        run: |
          for f in engine/premation-engine engine/premation-plugin-host engine/premation-host-bridge.node engine/*.so* sdk/bin/premation-plugins bin/premation-plugins; do
            [ -f "$f" ] || continue
            echo "================ $f"
            objdump -p "$f" | grep -E "NEEDED|RUNPATH|RPATH" || true
          done
          ls -la engine | head -40
      - name: Where the C++ runtime comes from in the link line
        if: always()
        working-directory: native/build/linux-clang-engine
        run: |
          for t in engine/premation-engine engine/premation-plugin-host engine/premation-host-bridge.node; do
            echo "================ $t"
            ninja -t commands "$t" | tail -1 > link.txt || true
            tr ' ' '\n' < link.txt | grep -nE "stdc\+\+|static-lib|libgcc|c\+\+abi|^-l|\.so($|\.)|^-Wl|^-fuse|^-static|^-pthread" | head -80
          done
          echo "================ configs and pkg-config files naming stdc++"
          grep -rlE "stdc\+\+" vcpkg_installed/x64-linux/share vcpkg_installed/x64-linux/lib/pkgconfig 2>/dev/null | head -30
          grep -rhoE "[^ ;\"]*stdc\+\+[^ ;\"]*" vcpkg_installed/x64-linux/share vcpkg_installed/x64-linux/lib/pkgconfig 2>/dev/null | sort | uniq -c | sort -rn | head -20
          grep -n "stdc++" CMakeCache.txt | head -10
      - name: Relink the engine without the explicit -lstdc++
        if: always()
        working-directory: native/build/linux-clang-engine
        run: |
          ninja -t commands engine/premation-engine | tail -1 > link.txt
          sed -E 's/(^| )-lstdc\+\+( |$)/ /g; s/(^| )-lstdc\+\+( |$)/ /g; s#(^| )[^ ]*libstdc\+\+\.so[^ ]*# #g; s# -o engine/premation-engine # -o /tmp/pe-test #' link.txt > relink.sh
          grep -c "pe-test" relink.sh
          bash relink.sh && echo "RELINK OK" || echo "RELINK FAILED"
          objdump -p /tmp/pe-test | grep NEEDED || true
          need=$(objdump -T /tmp/pe-test | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          echo "glibc needed: $need; GLIBCXX imported: $(objdump -T /tmp/pe-test | grep -c GLIBCXX || true)"
          ls -la /tmp/pe-test engine/premation-engine
