# Temporary: why CMake's FindThreads fails with clang 18 on ubuntu-22.04
# (release.yml's Linux engine). Removed once answered.
name: diag linux toolchain
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: Toolchain, as .github/actions/build-engine installs it
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          hash -r
          ls /usr/lib/gcc/x86_64-linux-gnu/
          dpkg -l | grep -E "libstdc\+\+-[0-9]+-dev|libgcc-[0-9]+-dev|^ii  g\+\+-|^ii  gcc-[0-9]+ " || true
      - name: Compile and link by hand
        if: always()
        run: |
          printf '#include <pthread.h>\nstatic void* r(void* a){return a;}\nint main(void){pthread_t t;pthread_create(&t,0,r,0);pthread_join(t,0);return 0;}\n' > t.cxx
          for cxx in clang++ /usr/bin/clang++-18 /usr/lib/llvm-18/bin/clang++; do
            echo "================ $cxx"
            "$cxx" -v t.cxx -pthread -o t.out 2>&1 | tail -40 || true
            echo "exit=$?"
          done
      - name: CMake FindThreads, three ways to name the compiler
        if: always()
        run: |
          mkdir p && cd p
          printf 'cmake_minimum_required(VERSION 3.25)\nproject(T LANGUAGES CXX)\nset(THREADS_PREFER_PTHREAD_FLAG ON)\nfind_package(Threads REQUIRED)\n' > CMakeLists.txt
          for cxx in clang++ /usr/bin/clang++-18 /usr/lib/llvm-18/bin/clang++; do
            echo "================ $cxx"
            rm -rf b
            if cmake -S . -B b -G Ninja -DCMAKE_CXX_COMPILER="$cxx" > out.txt 2>&1; then echo "CONFIGURE OK"; else echo "CONFIGURE FAILED"; fi
            tail -12 out.txt
            grep -n -B2 -A30 "pthread" b/CMakeFiles/CMakeConfigureLog.yaml | tail -70 || true
          done
      - name: CMake FindThreads with the engine's settings and the vcpkg toolchain
        if: always()
        run: |
          git clone -q https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q c76c06644034521fb761a39f8f52d8e87d1103d5
          mkdir q && cd q
          cat > CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.25)
          project(T LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          if(QUIET_FIRST)
            find_package(Threads QUIET)
          endif()
          find_package(Threads REQUIRED)
          CM
          sed -i 's/^          //' CMakeLists.txt
          try() {
            echo "================ $*"
            rm -rf b
            if cmake -S . -B b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ "$@" > out.txt 2>&1; then echo "CONFIGURE OK"; else echo "CONFIGURE FAILED"; fi
            tail -8 out.txt
            if grep -q "CONFIGURE FAILED\|Could NOT" out.txt; then tail -120 b/CMakeFiles/CMakeConfigureLog.yaml; fi
          }
          try
          try -DQUIET_FIRST=ON
          try -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
          try -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DQUIET_FIRST=ON
      - name: The same with clang-tools-18 installed
        if: always()
        run: |
          sudo apt-get install -y clang-tools-18 > /dev/null
          ls -l /usr/bin/clang-scan-deps* || true
          cd q
          for extra in "" "-DQUIET_FIRST=ON"; do
            echo "================ toolchain $extra"
            rm -rf b
            if cmake -S . -B b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" $extra > out.txt 2>&1; then echo "CONFIGURE OK"; else echo "CONFIGURE FAILED"; fi
            grep -E "pthread|Threads|SCAN_DEPS|Could NOT" out.txt || true
            grep -h "CMAKE_CXX_COMPILER_CLANG_SCAN_DEPS" b/CMakeCache.txt || true
          done
