# electron-builder packaging config → produces installable desktop binaries.
# Build with:  npm run dist   (installer)   |   npm run pack   (unpacked, fast)
appId: com.motioneditor.app
productName: Motion Editor
copyright: © Motion Editor

directories:
  output: release
  buildResources: build

# App/installer icon — build/icon.png (512×512 Premation mark). electron-builder
# derives the .ico / .icns / Linux icon set from it.
icon: build/icon.png

# The renderer bundle + compiled main/preload + manifest are all that ship.
files:
  - dist/**
  - dist-electron/**
  - package.json

# Bundle the motion-back server as a sidecar so the packaged desktop app can
# launch it itself (electron/backend.ts resolves <resources>/backend/dist/main.js).
# NOTE: this ships the server's node_modules (incl. the Prisma engine) and .env.
# The app still needs a reachable database — for a portable installer switch
# motion-back to SQLite, and provide the OpenAI key via a first-run setting
# rather than shipping .env. Run `npm run build` in ../motion-back first.
extraResources:
  - from: ../motion-back/dist
    to: backend/dist
  - from: ../motion-back/node_modules
    to: backend/node_modules
  - from: ../motion-back/prisma
    to: backend/prisma
  - from: ../motion-back/.env
    to: backend/.env

win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  category: public.app-category.graphics-design

linux:
  target: AppImage
  category: Graphics
