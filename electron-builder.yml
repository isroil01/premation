# electron-builder packaging config → produces installable desktop binaries.
# Build with:  npm run dist   (installer)   |   npm run pack   (unpacked, fast)
appId: com.premation.app
productName: Premation
copyright: © Premation contributors — licensed under the GNU AGPL v3.0

# Custom URL scheme for the desktop OAuth return. The backend redirects the
# one-time sign-in code to premation://oauth?code=…; this registers the app as
# the handler at install time (macOS Info.plist CFBundleURLTypes + Windows
# registry). electron/main.ts also claims it at runtime via
# setAsDefaultProtocolClient for dev. Inherited by electron-builder.selfhosted.yml.
protocols:
  - name: Premation OAuth
    schemes:
      - premation

directories:
  # Each build lands in its OWN versioned subfolder — release/0.1.0/, release/0.2.0/…
  # The ${version} macro reads package.json. Keeps installers, latest.yml and the
  # win-unpacked tree for one version from overwriting the previous one.
  output: release/${version}
  buildResources: build

# App/installer icon — build/icon.png (512×512 Premation mark). electron-builder
# derives the .ico / .icns / Linux icon set from it and embeds it in the .exe.
icon: build/icon.png

# The .exe carries the embedded icon, but the RUNNING window/taskbar icon is set
# in electron/main.ts (resolveAppIcon), which reads build/icon.png at
# <resources>/build/icon.png. It is NOT in `files` (that's app.asar), so ship it
# here or the packaged app falls back to Electron's default icon at runtime.
extraResources:
  - from: build/icon.png
    to: build/icon.png
  # The C++ engine process at <resources>/engine/, where
  # electron/engineSupervisor.ts looks in a packaged app. It is REQUIRED:
  # scripts/stageEngine.cjs (the beforePack hook below) stages the build for
  # this platform + arch into build/engine/ and fails the package when it is
  # missing (docs/TS_ENGINE_REMOVAL.md: one engine). Beside it:
  #   Windows  dxcompiler.dll + dxil.dll — Dawn loads DXC at runtime;
  #            DirectML.dll — ONNX Runtime's GPU provider for the ML jobs
  #   macOS    premation-host-bridge.node — main's IOSurface lookup (route C)
  #   Linux    any shared libraries the engine was linked against (*.so, *.so.N)
  - from: build/engine
    to: engine
    filter:
      - premation-engine*
      - premation-host-bridge.node
      - '*.dll'
      - '*.so'
      - '*.so.*'
  # The bundled ML models (electron/models.json `bundled: true`, staged by
  # scripts/fetchModels.cjs) OUTSIDE app.asar too: the engine reads the files
  # itself (it cannot read an archive); main points it at each folder with
  # PREMATION_<env>_DIR (engineHost.ts, modelManifest.ts bundledModelEnv).
  # One entry per model, not dist/models wholesale: a stray folder in a
  # developer's gitignored public/models must not ride along.
  - from: dist/models/object-matte
    to: models/object-matte
    filter:
      - '*.onnx'
      - model.json
  - from: dist/models/hand-landmarks
    to: models/hand-landmarks
    filter:
      - '*.onnx'
      - model.json
  - from: dist/models/face-landmarks
    to: models/face-landmarks
    filter:
      - '*.onnx'
      - model.json
  # The fonts the engine registers first (resources/fonts, scripts/fetchFonts.cjs):
  # outside app.asar because the engine reads them; main points it at fonts.json
  # with PREMATION_FONTS_MANIFEST (engineHost.ts bundledFontsManifest).
  - from: resources/fonts
    to: fonts
    filter:
      - fonts.json
      - '*.ttf'
      - '*.otf'
      - '*.woff2'
      - '*-OFL.txt'
  # The ffmpeg export encodes with (electron/ffmpegBinary.ts looks here first),
  # staged per platform + arch by scripts/fetchFfmpeg.cjs in beforePack from
  # the SHA-256 pin in electron/ffmpegManifest.json, with its GPL licence and
  # source notice. REQUIRED: a package without it is refused. If it goes missing
  # on a user's machine anyway (antivirus), the app re-downloads the same pin
  # (electron/ffmpegRepair.ts).
  - from: build/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg
      - ffmpeg.exe
      - LICENSE.txt
      - NOTICE.txt
  # Claude for Premation: the bundled MCP server (scripts/buildMcp.cjs). Outside
  # app.asar because Claude Desktop launches it — with this app's own binary as
  # Node — and a launched script must be a real file (docs/MCP_PLAN.md D6).
  - from: build/mcp
    to: mcp
    filter:
      - premation-mcp.cjs
      - tools.json

beforePack: ./scripts/beforePack.cjs

# The renderer bundle + compiled main/preload + manifest are all that ship.
#
# node_modules needs no entry here and adding one changes nothing: electron-builder
# walks package.json and copies PRODUCTION dependencies in regardless of these
# patterns, while excluding devDependencies (vite, typescript, jest, electron).
# Verified by building both ways — 146 packages land in app.asar either way,
# electron-updater and better-sqlite3 among them. Worth stating because the list
# reads as exhaustive and is not.
files:
  - dist/**
  - dist-electron/**
  - package.json
  # Compiled test files are build output of electron/*.test.ts and were shipping
  # inside app.asar. Nothing loads them, but a released app should not contain its
  # own test suite.
  - '!dist-electron/**/*.test.js'
  - '!dist-electron/**/*.test.js.map'

# ── No server sidecar here, deliberately ──────────────────────────────────────
# This config builds a CLIENT: the app talks to a motion-back over the network,
# at the origin baked in by VITE_BACKEND_ORIGIN (.env.production). Deploy the
# server once; ship this to everyone.
#
# It used to bundle the server via `extraResources`, which made every release
# build require a pre-built sibling `../motion-back` checkout — and copied that
# checkout's `.env`, i.e. the database URL, JWT_SECRET and AI_KEY_SECRET, into
# every installer handed to a user.
#
# To bundle the server anyway (a single-machine install with no deployment),
# use the config that extends this one:
#   npm run dist:selfhosted
# It ships the server WITHOUT any .env; the app reads configuration from
# <userData>/backend.env at first run instead. See electron-builder.selfhosted.yml.

# ── Where updates come from ───────────────────────────────────────────────────
# Publishing writes the installers AND the update metadata (latest.yml,
# latest-mac.yml, latest-linux.yml) to a GitHub release. electron-updater reads
# that metadata to decide whether a newer version exists — see electron/updater.ts.
#
# Both halves have to agree: an installer published somewhere the updater does
# not look produces an app that can never update itself, silently.
#
# `releaseType: draft` means a release is staged, not announced: the assets
# upload, nobody is notified, and no installed app sees the update until you
# press Publish in the GitHub UI. That is the review step between "the build
# finished" and "everyone gets it".
publish:
  provider: github
  owner: isroil01
  repo: premation
  releaseType: draft

# ── .pplugin: double-click installs a plugin (docs/PLUGIN_PLATFORM_PLAN.md P2) ──
# Windows (NSIS writes the registry keys) passes the path in argv; macOS sends
# `open-file`. Both reach electron/main.ts `routePackageFile`, which shows the
# install dialog — the same verify → stage → swap path as a store install.
fileAssociations:
  - ext: pplugin
    name: Premation Plugin
    description: Premation plugin package
    role: Viewer
    rank: Owner
    # Linux only: the MIME type the .desktop entry claims for the extension.
    mimeType: application/x-premation-plugin

win:
  target: nsis
  # One obvious file per platform, stable across versions — the version lives in
  # the release tag and in latest.yml. Trade-off worth knowing: a downloaded file
  # named without its version cannot be identified once it is in someone's
  # Downloads folder.
  artifactName: Premation-Setup-Windows.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Branded wizard art, rendered from scripts/installer-art/art.html by
  # `npx electron scripts/renderInstallerArt.cjs`. Drawn at 2x the MUI2 sizes
  # (sidebar 164x314, header 150x57): NSIS fits the bitmap to its control, so
  # it is 1:1 at 200 % scaling and downsampled, not blurred, at 100 %.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  # Page wording lives in installer.nsh (customWelcomePage / customUnWelcomePage).
  # customUnInstall: take Premation out of Claude Desktop's config on a real
  # uninstall (not an update) — docs/MCP_PLAN.md D9.
  include: build/installer.nsh

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.graphics-design
  # Per-arch, deliberately: an arm64 build does not run on an Intel Mac at all,
  # and a user who downloads the wrong one sees "the application is damaged" —
  # which reads as a corrupt download rather than a wrong architecture. Both
  # arches are built in ONE job so they share a latest-mac.yml.
  artifactName: Premation-macOS-${arch}.${ext}
  # ── Gatekeeper requirements ──
  # hardenedRuntime is REQUIRED for notarization; without it notarytool rejects
  # the submission outright. The entitlements below are the minimum an Electron
  # app needs to keep working under it — the JIT/unsigned-memory pair, because V8
  # generates code at runtime and the hardened runtime forbids that by default.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Window ▸ Panels ▸ Record Audio (voice-over). macOS shows this sentence in
  # the microphone prompt; without it TCC kills the process on the first
  # getUserMedia instead of asking. Paired with `device.audio-input` in the
  # entitlements (the hardened runtime refuses the mic without it).
  extendInfo:
    NSMicrophoneUsageDescription: Premation uses the microphone only when you record a voice-over or other audio in the Record Audio panel.
  # The engine and the host bridge are nested Mach-O files outside any
  # framework: named here so they are always signed (hardened runtime,
  # entitlementsInherit) before the app is sealed — an unsigned nested binary
  # is a notarization rejection. The engine needs disable-library-validation
  # (it dlopen()s native SDK plugins signed by their authors); the bridge is
  # loaded by Electron main, which already has it.
  binaries:
    - Contents/Resources/engine/premation-engine
    - Contents/Resources/engine/premation-host-bridge.node
    # Signed again by us (hardened runtime) — the publisher's own signature is
    # not ours, and notarization rejects a nested binary we did not sign.
    - Contents/Resources/ffmpeg/ffmpeg
  # electron-builder signs every nested binary, framework and helper it finds.
  # Missed components are the single most common notarization rejection, so this
  # is left ON rather than narrowed for build speed.
  notarize: false # handled explicitly in CI via notarytool; see .github/workflows/release.yml

linux:
  # One AppImage, x64. AppImage is the target electron-updater can update in
  # place (latest-linux.yml); a .deb or .rpm would have to be updated by the
  # user's package manager, which the app cannot drive. The engine ships
  # inside it unsigned — Linux has no code-signing gate to fail.
  target:
    - target: AppImage
      arch: [x64]
  category: Graphics
  synopsis: Motion design and animation
  artifactName: Premation-Linux-${arch}.${ext}
  # The desktop entry is electron-builder's: it adds x-scheme-handler/premation
  # from `protocols` and the .pplugin MIME type from `fileAssociations` itself.

# ── Signing ───────────────────────────────────────────────────────────────────
# Credentials come from CI SECRETS ONLY. Nothing here, nothing in the repo.
#
# electron-builder picks signing up from the environment:
#   macOS    CSC_LINK / CSC_KEY_PASSWORD  → Developer ID Application .p12
#   Windows  CSC_LINK / CSC_KEY_PASSWORD  → code-signing cert
# and CSC_IDENTITY_AUTO_DISCOVERY=false disables signing entirely.
#
# The release workflow FAILS if an artifact comes out unsigned. It does not fall
# back to publishing unsigned — an unsigned artifact reaching users is the thing
# the whole pipeline exists to prevent, and "publish anyway" is how that happens
# at 2am.
#
# What unsigned costs, stated plainly:
#  • macOS — Gatekeeper BLOCKS the app. Since Sequoia there is no Control-click
#    override; the user must go to System Settings ▸ Privacy & Security. And
#    Squirrel.Mac refuses updates it cannot verify, which is why
#    electron/updater.ts keeps macOS auto-update behind a flag.
#  • Windows — SmartScreen warns ("Windows protected your PC"). It still
#    installs via "More info ▸ Run anyway", and auto-update still works.
